services:
  - type: web
    name: telegram-apk-ci-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot/main.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_CHAT_IDS
        sync: false
      - key: GITHUB_PAT
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_WORKFLOW
        value: build-and-deploy.yml
      - key: GITHUB_BRANCH
        value: main
      - key: WEBHOOK_SECRET
        sync: false
