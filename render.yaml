services:
  - type: web
    name: telegram-apk-ci-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot/main.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_IDS
        value: "-1003962969725"
      - key: GITHUB_PAT
        sync: false
      - key: GITHUB_OWNER
        value: retrihgtrtyuh-cmd
      - key: GITHUB_REPO
        value: xianxia-sect-maneger
      - key: GITHUB_WORKFLOW
        value: build-apk.yml
      - key: GITHUB_BRANCH
        value: main
      - key: WEBHOOK_SECRET
        sync: false
