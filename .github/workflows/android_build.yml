name: Android Release APK & Source Backup

on:
  # 1. Автоматический запуск при каждом пуше в ветку main
  push:
    branches:
      - main

  # 2. Удаленный запуск из Telegram-бота по команде /build (GitHub Repository Dispatch)
  repository_dispatch:
    types:
      - build_apk

  # 3. Ручной запуск из вкладки Actions в веб-интерфейсе GitHub
  workflow_dispatch:
    inputs:
      notes:
        description: 'Комментарий к сборке'
        required: false
        default: 'Ручной запуск из GitHub UI'

jobs:
  build-and-deliver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout исходного кода
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch || github.ref }}
          fetch-depth: 0

      - name: 1. Автоматический бэкап исходного кода (.tar.gz)
        id: backup
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")
          ARCHIVE_NAME="backup_${ SHORT_SHA }_${ TIMESTAMP }.tar.gz"
          tar --exclude='./.git' --exclude='./build' --exclude='./app/build' -czf "/tmp/${ARCHIVE_NAME}" .
          mv "/tmp/${ARCHIVE_NAME}" "./${ARCHIVE_NAME}"
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT

      - name: Сохранение архива бэкапа в GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-backup-${{ github.run_number }}
          path: ${{ steps.backup.outputs.archive_name }}
          retention-days: 30

      - name: Установка JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Инициализация Android SDK
        uses: android-actions/setup-android@v3

      - name: 2. Восстановление секретного ключа (.jks) из Base64
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release-key.jks

      - name: Сборка и подпись релизного APK (Gradle assembleRelease)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release-key.jks \
            -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${KEY_PASSWORD}"

      - name: Сбор метаданных коммита и автора
        id: meta
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_AUTHOR=$(git log -1 --pretty=format:'%an (%ae)')
          COMMIT_MSG=$(git log -1 --pretty=format:'%s')
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "author=${COMMIT_AUTHOR}" >> $GITHUB_OUTPUT
          echo "commit_msg=${COMMIT_MSG}" >> $GITHUB_OUTPUT
          echo "apk_path=${APK_PATH}" >> $GITHUB_OUTPUT

      - name: 3A. Отправка APK на вебхук нашего Telegram-бота (Render / Railway / VPS)
        if: ${{ secrets.BOT_WEBHOOK_URL != '' }}
        run: |
          curl -sS -X POST "${{ secrets.BOT_WEBHOOK_URL }}/api/upload-apk" \
            -H "X-Webhook-Secret: ${{ secrets.WEBHOOK_SECRET }}" \
            -F "apk_file=@${{ steps.meta.outputs.apk_path }}" \
            -F "commit_sha=${{ steps.meta.outputs.commit_sha }}" \
            -F "commit_msg=${{ steps.meta.outputs.commit_msg }}" \
            -F "author=${{ steps.meta.outputs.author }}" \
            -F "branch=${{ github.event.client_payload.branch || github.ref_name }}" \
            -F "build_number=${{ github.run_number }}" \
            -F "backup_archive=${{ steps.backup.outputs.archive_name }}"

      - name: 3B. Прямая отправка APK и бэкапа через Telegram Bot API (sendDocument)
        if: ${{ secrets.BOT_WEBHOOK_URL == '' }}
        run: |
          CAPTION="📦 <b>Сборка APK #${{ github.run_number }} готова!</b>%0A• <b>Ветка:</b> <code>${{ github.event.client_payload.branch || github.ref_name }}</code>%0A• <b>Автор:</b> ${{ steps.meta.outputs.author }}%0A• <b>Коммит:</b> <code>${{ steps.meta.outputs.short_sha }}</code> — ${{ steps.meta.outputs.commit_msg }}%0A• <b>Бэкап:</b> <code>${{ steps.backup.outputs.archive_name }}</code>"
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F "parse_mode=HTML" \
            -F "caption=${CAPTION}" \
            -F "document=@${{ steps.meta.outputs.apk_path }}"

      - name: Очистка секретного ключа (.jks) после сборки
        if: always()
        run: rm -f app/release-key.jks
